spring.application.name=ticketing-api

# *** Logs ***
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.github.loickcherimont.ticketing_api=DEBUG

# Load environment variables to use them
spring.config.import=optional:file:.env.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Hibernate configurations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# *** Swagger and API docs ***

# Custom configs for API docs and Swagger UI 
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html

# To sort the routes in Swagger using alphabetical order
springdoc.swagger-ui.tagsSorter=alpha

# Spring Boot follow Railway's X-Forwarded-Proto headers
# If Railway sends HTTPS, Spring Boot sends HTTPS to
server.forward-headers-strategy=framework