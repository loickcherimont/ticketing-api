spring.application.name=ticketing-api

# *** Logs ***
logging.level.root=ERROR
logging.level.com.github.loickcherimont.ticketing_api=DEBUG
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# Dev / testing : Load environment variables to use them
spring.config.import=optional:file:.env.properties

# Hibernate configurations
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# *** Swagger and API docs ***

# Custom configs for API docs and Swagger UI 
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html

# To sort the routes in Swagger using alphabetical order
springdoc.swagger-ui.tagsSorter=alpha

# Spring Boot follow Railway's X-Forwarded-Proto headers
# If Railway sends HTTPS, Spring Boot sends HTTPS to
server.forward-headers-strategy=framework

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}