# Hibernate development configurations
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing_api
spring.datasource.username=compose-postgres
spring.datasource.password=compose-postgres

# Flyway: migrate schema + demo data (dev profile only)
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed

cors.allowed-origins=http://localhost:4200,http://127.0.0.1:8081